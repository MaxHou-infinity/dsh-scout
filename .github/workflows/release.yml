name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: verify + publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the release gate
        run: npm run check:release

      - name: Pack the tarball
        run: pnpm pack

      - name: Require npm publish credential
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo '::error::NPM_TOKEN is required before creating a release'
            exit 1
          fi

      - name: Publish to npm
        run: |
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' >> .npmrc
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release with tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-scout-*.tgz
          generate_release_notes: true
          update_release: true
